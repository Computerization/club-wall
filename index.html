<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="icons/WFLA.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b09" />
    <meta name="description" content="WFLA Club Wall — 寻找属于你的社团。Discover, preview, and join the community that's right for you." />
    <title>Club Wall · 世外社团招新</title>
    <script>
      // On every load, match the browser/system colour scheme (dark if the
      // browser exposes no preference) before first paint.
      (function () {
        try {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var light = window.matchMedia('(prefers-color-scheme: light)').matches;
          var t = dark ? 'dark' : light ? 'light' : 'dark';
          var r = document.documentElement;
          r.dataset.theme = t;
          r.style.colorScheme = t;
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
