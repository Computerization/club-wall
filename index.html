<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="icons/WFLA.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b09" />
    <meta name="description" content="WFLA Club Wall — 寻找属于你的社团。Discover, preview, and join the community that's right for you." />
    <title>Club Wall · 世外社团招新</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem('cw-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var r = document.documentElement;
          r.dataset.theme = t;
          r.style.colorScheme = t;
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
